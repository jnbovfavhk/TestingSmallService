[pytest]
testpaths = autotest
addopts =
    -v
    -ra
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(message)s
markers =
    auth: проверки авторизации
    e2e: сквозной сценарий до создания заказа